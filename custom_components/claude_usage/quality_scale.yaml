# Integration Quality Scale — geprüft am 05.10.2026.
# Alle aktuellen Bronze-Regeln; tests_ha dokumentiert reproduzierbare Nachweise.
# Siehe Verwaltungsreview 2026-10-05-bronze-nachweise.md für die Grenzen.
rules:
  action-setup:
    status: exempt
    comment: Die Integration registriert keine Aktionen.
  appropriate-polling:
    status: done
    comment: >-
      `DataUpdateCoordinator` mit Vorgabe 300 s (60–3600 einstellbar). Jede
      Abfrage ist eine echte Anfrage gegen das Abo-Kontingent, deshalb ist die
      Vorgabe bewusst grob und die Untergrenze bei 60 s festgenagelt.
  brands: done
  common-modules:
    status: done
    comment: >-
      Coordinator in `coordinator.py`; eine gemeinsame Entitätsbasis gibt es
      nicht, weil es nur eine Plattform mit einer einzigen Entitätsklasse gibt.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py führt echte HA-Flowmanager aus. Config-,
      Options- und vorhandene Reauth/Reconfigure-Flows einschließlich
      Fehler-Recovery und Dubletten: 100 % Zeilen- und Zweigabdeckung,
      --cov-branch --cov-fail-under=100, HA 2026.7.0 und 2026.9.2.
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: Keine externen requirements; HTTP-Client kommt von Home Assistant.
  docs-actions:
    status: exempt
    comment: Die Integration registriert keine Aktionen.
  docs-triggers:
    status: exempt
    comment: Keine eigenen Automations-Trigger bereitgestellt.
  docs-conditions:
    status: exempt
    comment: Keine eigenen Automations-Bedingungen bereitgestellt.
  docs-high-level-description:
    status: done
    comment: README, Abschnitt „Wofür das gut ist".
  docs-installation-instructions:
    status: done
    comment: README, Abschnitte „Installation über HACS", „Token beschaffen", „Einrichtung".
  docs-removal-instructions:
    status: done
    comment: README, Abschnitt „Entfernen".
  entity-event-setup:
    status: done
    comment: >-
      CoordinatorEntity registriert Listener in async_added_to_hass und
      entfernt sie über async_on_remove.
  entity-unique-id:
    status: done
    comment: "`sensor.py`: `_attr_unique_id = f\"{entry.entry_id}_{description.key}\"`."
  has-entity-name:
    status: done
    comment: "`sensor.py`: `_attr_has_entity_name = True`."
  runtime-data:
    status: done
    comment: "`entry.runtime_data` hält den Coordinator; `hass.data` wird nicht benutzt."
  test-before-configure:
    status: done
    comment: >-
      Der Config-Flow ruft `fetch_usage` mit dem eingegebenen Token auf und legt
      den Eintrag erst nach einer erfolgreichen Antwort an. Der Reauth-Schritt
      macht dasselbe, bevor er das alte Token ersetzt.
  test-before-setup:
    status: done
    comment: "`async_setup_entry` ruft `async_config_entry_first_refresh()`."
  unique-config-entry:
    status: done
    comment: >-
      `async_set_unique_id(DOMAIN)` plus `_abort_if_unique_id_configured()`. Es
      gibt genau ein claude.ai-Abo je Home Assistant; eine Konto-ID liefern die
      Rate-Limit-Header nicht.
